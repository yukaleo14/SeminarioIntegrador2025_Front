
<div style="display: flex; justify-content: center;">

    <mat-card>
        <mat-card-header>
            <h1>Registro</h1>
        </mat-card-header>
        <form>
        <mat-card-content>
            <div class = "card-content">
                 <mat-form-field appearance="outline">
                <mat-label>Mail</mat-label>
                <input matInput type="email" placeholder="Mail">
                <mat-icon matSuffix>mail</mat-icon>
            </mat-form-field>

            <p></p>

            <mat-form-field appearance="outline">
                <mat-label>Contraseña</mat-label>
                <input [type]="hide() ? 'password' : 'text'" matInput placeholder="Contraseña">
                <button mat-icon-button matSuffix (click)="toggleHide()" [attr.aria-label]="'Hide Password'"
                    [attr.aria-pressed]="hide()" type="button"><mat-icon>{{hide() ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
            </mat-form-field>

            <p></p>

            <mat-form-field appearance="outline">
                <mat-label>Confirmar Contraseña</mat-label>
                <input [type]="hide2() ? 'password' : 'text'" matInput placeholder="Contraseña">
                <button mat-icon-button matSuffix (click)="toggleHide2()" [attr.aria-label]="'Hide Password'"
                    [attr.aria-pressed]="hide()" type="button"><mat-icon>{{hide() ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
            </mat-form-field>            <p></p>
            <mat-checkbox>Acepto los terminos y condiciones</mat-checkbox>

            </div>
           


        </mat-card-content>

        <mat-card-actions>


            <button mat-flat-button type="button" (click)="onRegistrarse()" aria-label="Registrarse">
                Registrarse
            </button>
            
            
        </mat-card-actions>
        </form>
        



    </mat-card>

</div>
