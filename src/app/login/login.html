<div class="card-container">
    <mat-card class="login-card">
        <mat-card-header class="card-header">
            <h1>Ingreso</h1>
        </mat-card-header>
        <form [formGroup]="formularioLogin" (ngSubmit)="onSubmit()">
            <mat-card-content class="card-content">
                    
                    @if (errorMessage()) {
                        <div class="error-alert">
                            <mat-icon>error_outline</mat-icon>
                            <span>{{ errorMessage() }}</span>
                        </div>
                    }

                    <mat-form-field appearance="outline">
                        <mat-label>Mail</mat-label>
                        <input matInput type="email" placeholder="Mail" formControlName="mail">
                        <mat-icon matSuffix>mail</mat-icon>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Contraseña</mat-label>
                        <input matInput [type]="hide() ? 'password' : 'text'" placeholder="Contraseña"
                            formControlName="contrasena">
                        <button mat-icon-button matSuffix (click)="toggleHide()" [attr.aria-label]="'Hide Password'"
                            [attr.aria-pressed]="hide()" type="button">
                            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-checkbox [checked]="remember_me()" (change)="remember_me.set($event.checked)">Recuérdame</mat-checkbox>
            </mat-card-content>

            <mat-card-actions class="login-card-actions">
                <button mat-stroked-button type="button" (click)="onRegistrarse()" aria-label="Registrarse">
                    Registrarse
                </button>
                <button mat-flat-button color="primary" type="submit" aria-label="Iniciar sesion" [disabled]="!formularioLogin.valid">
                    Iniciar sesión
                </button>
            </mat-card-actions>
        </form>
    </mat-card>
</div>
