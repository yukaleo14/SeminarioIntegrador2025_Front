<div style="display: flex; justify-content: center;">

    <mat-card>
        <mat-card-header class="card-header">
            <h1>Ingreso</h1>
        </mat-card-header>
        <form>
        <mat-card-content>
            <div class = "card-content">
                 <mat-form-field appearance="outline">
                        <mat-label>Mail</mat-label>
                        <input matInput type="email" placeholder="Mail">
                        <mat-icon matSuffix>mail</mat-icon>
                </mat-form-field>



            <mat-form-field appearance="outline">
                <mat-label>Contraseña</mat-label>
                <input [type]="hide() ? 'password' : 'text'" matInput placeholder="Contraseña">
                <button mat-icon-button matSuffix (click)="toggleHide()" [attr.aria-label]="'Hide Password'"
                    [attr.aria-pressed]="hide()" type="button"><mat-icon>{{hide() ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
            </mat-form-field>

            <mat-checkbox>Recuerdame</mat-checkbox>

            </div>
           


        </mat-card-content>

        <mat-card-actions>


            <button mat-stroked-button type="button" (click)="onRegistrarse()" aria-label="Registrarse">
                Registrarse
            </button>
            <button mat-flat-button type="submit" aria-label="Registrarse">
                Iniciar sesion
            </button>
        </mat-card-actions>
        </form>
    </mat-card>

</div>
