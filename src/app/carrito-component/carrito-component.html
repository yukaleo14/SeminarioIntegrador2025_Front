<div class="carrito-container">

  <h2>Mi Carrito</h2>

  <h3>¿Dónde retiras o te entregamos el pedido?</h3>

<app-seleccion-ubicaciones 
  [sucursalLatLng]="[sucursalActual?.latitud || 0, sucursalActual?.longitud || 0]" 
  [sucursalNombre]="sucursalActual?.nombre || 'Sucursal Principal'"
  (ubicacionSeleccionada)="onUbicacionSeleccionada($event)">
</app-seleccion-ubicaciones>

<button (click)="confirmarPedido()" [disabled]="!ubicacionEntrega() || isLoading()">
  Confirmar Pedido
</button>

  <div *ngIf="items().length > 0">
    <div class="items-list">
      <div *ngFor="let item of items()" class="cart-item">
        <img [src]="item.producto.imagen" [alt]="item.producto.nombre" class="item-img">

        <div class="item-info">
          <h4>{{ item.producto.nombre }}</h4>
          <p class="precio-unitario">${{ item.producto.precio }}</p>
        </div>

        <div class="quantity-control">
          <button (click)="disminuirCantidad(item)">−</button>
          <span>{{ item.cantidad }}</span>
          <button (click)="aumentarCantidad(item)">+</button>
        </div>

        <div class="subtotal">
          ${{ (item.producto.precio * item.cantidad) }}
        </div>

        <button class="btn-eliminar" (click)="eliminarProducto(item)">✕</button>
      </div>
    </div>

    <div class="resumen">
      <h3>Total: ${{ totalPrice() }}</h3>
      <p>Cantidad de productos: {{ totalItems() }}</p>

      <div class="acciones">
        <button class="btn-secondary" (click)="vaciarCarrito()">Vaciar Carrito</button>
        <button 
          class="btn-confirmar" 
          (click)="confirmarPedido()"
          [disabled]="isLoading()">
          {{ isLoading() ? 'Procesando...' : 'Confirmar Pedido' }}
        </button>
      </div>
    </div>
  </div>
 <div *ngIf="items().length === 0" class="carrito-vacio">
    <p>Tu carrito está vacío</p>
</div>
  <div  class="carrito-vacio">
    <button (click)="volverALaTienda()" class="btn-primary">Ver productos</button>
  </div>
</div>
