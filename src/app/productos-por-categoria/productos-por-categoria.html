<app-header></app-header>
<div class="productos-container">
  <div class="page-header">
    <button class="btn-volver" (click)="volver()">← Volver</button>
    <h2>{{ categoriaActual()?.nombre ?? 'Productos' }}</h2>
  </div>

  @if (loading()) {
    <div class="estado-mensaje">Cargando productos...</div>
  }

  @if (error()) {
    <div class="estado-mensaje error">{{ error() }}</div>
  }

  @if (!loading() && !error()) {
    @if (productos().length > 0) {
      <div class="productos-grid">
        @for (producto of productos(); track producto.id) {
          <app-producto-card [producto]="producto" (agregar)="agregarAlCarrito($event)"></app-producto-card>
        }
      </div>
    } @else {
      <div class="estado-mensaje">No se encontraron productos en esta categoría.</div>
    }
  }
</div>
