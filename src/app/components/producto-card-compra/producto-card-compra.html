<mat-card class="producto-card-compra">
  <div class="card-image-wrapper">
    <img [ngSrc]="getImagenUrl(producto().imagen || '.')" width="150" height="150" [alt]="producto().nombre" />
  </div>

  <div class="card-body">
    <h4 class="producto-nombre">{{ producto().nombre }}</h4>
    <div class="precio">${{ producto().precio }}</div>
  </div>

  <div class="actions">
    @if (!expandido()) {
      <button mat-mini-fab color="primary" class="add-button" (click)="expandir()">
        <mat-icon>add</mat-icon>
      </button>
    } @else {
      <div class="cantidad-container">
        <button mat-icon-button class="stepper-btn" (click)="decrementar()">
          <mat-icon>remove</mat-icon>
        </button>
        <span class="cantidad-valor">{{ cantidad }}</span>
        <button mat-icon-button class="stepper-btn" (click)="incrementar()">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button class="confirm-btn" (click)="confirmar()">
          <mat-icon>check</mat-icon>
        </button>
        <button mat-icon-button class="cancel-btn" (click)="cancelar()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-card>
