<div class="carrusel-categorias scroll-container">
  @if (filtroSucursal()) {
    <button class="todos-chip" [class.activo]="categoriaActivaId() === 0" (click)="onTodosClick()">
      Todos
    </button>
  }
  @for (item of categorias(); track item.id) {
    <div class="categoria-wrapper" [class.activo]="categoriaActivaId() === item.id">
      <app-item-categoria [data]="item" (click)="onCategoriaClick(item)"></app-item-categoria>
    </div>
  }
</div>
