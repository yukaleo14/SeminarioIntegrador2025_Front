<a [routerLink]="['/sucursal/', sucursal()!.id]" class="empresa-card">
    <img class="empresa-portada" [width]="320" [height]="150"  [ngSrc]="getImagenUrl()" [alt]="sucursal().nombre">
    <div class="empresa-title">
        <span class="empresa-nombre">{{sucursal().nombre}}</span>
        <span class="empresa-descripcion">{{ sucursal().descripcion || 'Sucursal' }}</span>
        <span class="empresa-categorias">{{sucursal().categorias}}</span>
    </div>
</a>
