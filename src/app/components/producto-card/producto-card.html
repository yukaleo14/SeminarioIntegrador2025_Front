<mat-card class="producto-card" (click)="irASucursal()">
  <div class="card-image-wrapper">
    <img [ngSrc]="getImagenUrl(producto().imagen || 'assets/placeholder.jpg')" width="150" height="150" [alt]="producto().nombre" />
  </div>

  <div class="card-body">
    <h4 class="producto-nombre">{{ producto().nombre }}</h4>
    @if (producto().sucursal?.nombre) {
      <p class="sucursal-chip">
        <span class="dot"></span>{{ producto().sucursal?.nombre }}
      </p>
    }
    <div class="precio">${{ producto().precio }}</div>
  </div>
</mat-card>
