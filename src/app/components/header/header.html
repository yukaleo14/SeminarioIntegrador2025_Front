<mat-toolbar class="theme-primary">
  <span class="example-spacer"></span>

  @if (this.isLoggedIn()) {
  <button mat-icon-button aria-label="Menú de usuario" [matMenuTriggerFor]="userMenu">
    <mat-icon class="material-symbols-outlined">
      account_circle
    </mat-icon>
  </button>
  }@else {
  <a matIconButton [routerLink]="'/login'" aria-label="Iniciar sesión / registrarse">
    <mat-icon class="material-symbols-outlined">
      account_circle
    </mat-icon>
  </a>
  }

</mat-toolbar>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item (click)="logout()">
    <mat-icon class="material-symbols-outlined">logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>

</mat-menu>
