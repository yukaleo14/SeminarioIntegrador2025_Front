<mat-toolbar class="theme-primary">
  <span class="example-spacer"></span>

  @if (this.isLoggedIn()) {
  <button mat-icon-button aria-label="Carrito de compras">
    <mat-icon class="material-symbols-outlined">
      shopping_cart
    </mat-icon>
  </button>
  }@else {
  <a matIconButton [routerLink]="'/login'" aria-label="Iniciar sesión / registrarse">
    <mat-icon class="material-symbols-outlined">
      account_circle
    </mat-icon>
  </a>
  }

</mat-toolbar>
