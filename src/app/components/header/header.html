<mat-toolbar class="glass-header">

  <a routerLink="/" class="logo-link">
    <img ngSrc="/logo_PedYa.png" alt="PedYa" width="120" height="36" priority class="logo" />
  </a>

  <span class="example-spacer"></span>

  @if (isLoggedIn() && esComprador()) {
    <button mat-icon-button 
            [matBadge]="totalItems()"
            matBadgeColor="warn"
            aria-label="Ver carrito"
            (click)="irAlCarrito()"
            class="cart-button action-btn">
      <mat-icon class="material-symbols-outlined">shopping_cart</mat-icon>
    </button>
  }

  @if (this.isLoggedIn()) {
    <button mat-icon-button 
            class="action-btn"
            aria-label="Menú de usuario" 
            [matMenuTriggerFor]="userMenu">
      <mat-icon class="material-symbols-outlined">
        account_circle
      </mat-icon>
    </button>
  } @else {
    <a mat-icon-button 
       class="action-btn"
       [routerLink]="'/login'" 
       aria-label="Iniciar sesión / registrarse">
      <mat-icon class="material-symbols-outlined">
        account_circle
      </mat-icon>
    </a>
  }

</mat-toolbar>

<mat-menu #userMenu="matMenu" class="glass-menu">
  <button mat-menu-item (click)="logout()">
    <mat-icon class="material-symbols-outlined text-danger">logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
