<app-header></app-header>


<div class="page-container">
  <div class="page-header"> </div>
  
  <mat-card class="table-card">    
    <div class="page-header">
    <button mat-icon-button (click)="goToHome()" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1>Mis Productos</h1>
    </div>
  </div>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="full-width">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef> Categoría </th>
          <td mat-cell *matCellDef="let element"> {{element.categoria?.nombre ?? 'Sin categoría'}} </td>
        </ng-container>

        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef> Precio </th>
          <td mat-cell *matCellDef="let element"> {{element.precio | currency}} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>
            <span class="actions-header">
              Acciones
              <button mat-icon-button (click)="openDialog()" aria-label="Agregar producto">
                <mat-icon>add_circle</mat-icon>
              </button>
            </span>
          </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="openDialog(element)" aria-label="Ver producto">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
