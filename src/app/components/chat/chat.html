<!-- Botón flotante para abrir el chat -->
@if (!abierto()) {
  <button class="chat-fab" (click)="toggleChat()" mat-fab color="primary">
    <mat-icon>chat</mat-icon>
  </button>
}

<!-- Panel del chat -->
@if (abierto()) {
  <div class="chat-panel">
    <!-- Header -->
    <div class="chat-panel-header">
      <div class="chat-header-info">
        <mat-icon class="chat-header-icon">chat</mat-icon>
        <div>
          <span class="chat-header-title">{{ otherUser()?.mail || 'Chat' }}</span>
          <span class="chat-header-sub">
            @if (otherUser()) { En línea } @else { Esperando conexión... }
          </span>
        </div>
      </div>
      <button mat-icon-button (click)="cerrarChat()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Mensajes -->
    <div #scrollContainer class="chat-messages">
      @if (mostrarMsj()) {
        @for (message of messages(); track message.timestamp) {
          <div
            [ngClass]="{'my-message': isCurrentUser(message), 'other-message': !isCurrentUser(message)}"
            class="message-bubble">
            <div class="message-text">{{ message.text }}</div>
            <div class="timestamp">{{ message.timestamp | date:'shortTime' }}</div>
          </div>
        }
      }
    </div>

    <!-- Input -->
    <div class="chat-input-row">
      <mat-form-field appearance="outline" class="chat-input-field">
        <input matInput placeholder="Escribí un mensaje..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
      </mat-form-field>
      <button mat-fab color="primary" class="chat-send-btn" (click)="sendMessage()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
}
